<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{$maccms.site_name}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="/">{$maccms.site_name}</a>

  <nav class="main-nav">
    <a href="/">首页</a>
    {maccms:type parent="0" num="10" order="desc" by="sort"}
      <a href="{:mac_url_type($type)}">{$type.type_name}</a>
    {/maccms:type}
  </nav>

  <form class="search-form" action="/search" method="get">
    <input type="text" name="wd" value="{$param.wd}" placeholder="影片名 / 演员">
    <button type="submit">搜索</button>
  </form>
</header>

<main class="container">
