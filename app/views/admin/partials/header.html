<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini MacCMS 后台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin-body">
<header class="admin-header">
  <a class="logo" href="/admin">Mini MacCMS</a>
  <nav>
    <a href="/admin">仪表盘</a>
    <a href="/admin/types">分类管理</a>
    <a href="/admin/vods">影片管理</a>
    <a href="/admin/sources">采集源</a>
    <a href="/admin/sources/import">导入规则</a>
    <a href="/admin/collect">快速采集</a>
    <a href="/" target="_blank">打开前台</a>
  </nav>
  <div class="admin-user">
    {$adminName}
    <a href="/admin/logout">退出</a>
  </div>
</header>

<main class="admin-container">
  {if $msg}
    <div class="alert alert-ok">{$msg}</div>
  {/if}
  {if $err}
    <div class="alert alert-error">{$err}</div>
  {/if}
