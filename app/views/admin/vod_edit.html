{include file="admin/partials/header"}

<div class="page-head">
  <div>
    <p class="eyebrow">VIDEO EDIT</p>
    <h1>{if $form.vod_id}编辑影片{else}新增影片{/if}</h1>
  </div>
  <a class="btn" href="/admin/vods">← 返回列表</a>
</div>

<div class="panel">
  <form class="form-grid" action="/admin/vods/save" method="post">
    <input type="hidden" name="_csrf" value="{$csrf}">
    <input type="hidden" name="vod_id" value="{$form.vod_id}">

    <label>
      影片名称
      <input type="text" name="vod_name" value="{$form.vod_name}" required>
    </label>

    <label>
      分类
      <select name="type_id" required>
        <option value="0">请选择分类</option>
        {foreach $types as $t}
          <option value="{$t.type_id}" {if $t.type_id == $form.type_id}selected{/if}>{$t.type_name}</option>
        {/foreach}
      </select>
    </label>

    <label>
      英文别名（留空自动生成）
      <input type="text" name="vod_en" value="{$form.vod_en}">
    </label>

    <label>
      封面图 URL
      <input type="text" name="vod_pic" value="{$form.vod_pic}" placeholder="https://...">
    </label>

    <label>
      主演
      <input type="text" name="vod_actor" value="{$form.vod_actor}" placeholder="张三,李四">
    </label>

    <label>
      导演
      <input type="text" name="vod_director" value="{$form.vod_director}">
    </label>

    <label>
      年份
      <input type="text" name="vod_year" value="{$form.vod_year}">
    </label>

    <label>
      地区
      <input type="text" name="vod_area" value="{$form.vod_area}" placeholder="中国">
    </label>

    <label>
      语言
      <input type="text" name="vod_lang" value="{$form.vod_lang}" placeholder="国语">
    </label>

    <label>
      备注
      <input type="text" name="vod_remarks" value="{$form.vod_remarks}" placeholder="HD / 更新至3集">
    </label>

    <label>
      评分
      <input type="number" step="0.1" min="0" max="10" name="vod_score" value="{$form.vod_score}">
    </label>

    <label>
      状态
      <select name="vod_status">
        <option value="1" {if $form.vod_status == 1}selected{/if}>已发布</option>
        <option value="0" {if $form.vod_status == 0}selected{/if}>待审</option>
      </select>
    </label>

    <label class="span-2">
      简介
      <textarea name="vod_content" rows="4">{$form.vod_content}</textarea>
    </label>

    <label class="span-2">
      播放线路（一行一条）
      <textarea name="play_from" rows="3" placeholder="m3u8">{$form.play_from}</textarea>
      <small class="hint">每行代表一条线路，例如：m3u8、iframe、youku。</small>
    </label>

    <label class="span-2">
      播放地址（一行一条，与线路一一对应）
      <textarea name="play_url" rows="5" placeholder="第1集$https://...m3u8#第2集$https://...m3u8">{$form.play_url}</textarea>
      <small class="hint">同一线路内用 # 分隔剧集，用 $ 分隔剧集名和地址。不同线路之间由系统用 $$$ 拼接。</small>
    </label>

    <div class="form-actions span-2">
      <button class="btn btn-primary" type="submit">保存影片</button>
      <a class="btn" href="/admin/vods">取消</a>
    </div>
  </form>
</div>

{include file="admin/partials/footer"}
